[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cadverify"
version = "0.1.0"
description = "A pose-invariant verifier for 2D-drawing-to-3D-CAD generation"
requires-python = ">=3.10"
dependencies = ["cadquery-ocp>=7.9", "numpy>=2", "scipy>=1.14"]

[project.optional-dependencies]
dev = ["pytest>=8"]
experiments = ["anthropic>=1.3", "build123d>=0.11"]

[tool.setuptools.packages.find]
include = ["cadverify*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
